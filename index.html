<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг Траекторий Полёта</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #05070a;
            color: #d1d5db;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .ui-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #f3f4f6;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ui-header h1::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .ui-header p {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .btn {
            background: #1f2937;
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #374151;
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #2563eb;
            border-color: #3b82f6;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 12px;
            min-width: 220px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #9ca3af;
        }

        .stat-value {
            font-weight: 700;
            color: #38bdf8;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="ui-header">
        <h1>Движение по маршрутам</h1>
        <p>Плавные закругления • Залёты в города • Без тряски</p>
    </div>

    <div class="stats-panel">
        <div class="stat-item">
            <span class="stat-label">Точек на карте:</span>
            <span class="stat-value" id="stat-cities">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Объектов в воздухе:</span>
            <span class="stat-value" id="stat-objects">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Траектория:</span>
            <span class="stat-value" style="color: #4ade80;">Плавный изгиб</span>
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn btn-primary" onclick="addAircraft()">+ Запустить объект</button>
        <button class="btn" onclick="clearTrails()">Очистить шлейф</button>
        <button class="btn" onclick="resetAll()">Сброс</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initCities();
        }

        let cities = [];

        // Список городов
        const cityData = [
            { name: "Киев", rx: 0.48, ry: 0.32 },
            { name: "Харьков", rx: 0.78, ry: 0.35 },
            { name: "Одесса", rx: 0.50, ry: 0.78 },
            { name: "Днепр", rx: 0.68, ry: 0.52 },
            { name: "Львов", rx: 0.18, ry: 0.38 },
            { name: "Запорожье", rx: 0.72, ry: 0.60 },
            { name: "Кривой Рог", rx: 0.61, ry: 0.58 },
            { name: "Николаев", rx: 0.54, ry: 0.70 },
            { name: "Мариуполь", rx: 0.82, ry: 0.68 },
            { name: "Винница", rx: 0.38, ry: 0.48 },
            { name: "Полтава", rx: 0.66, ry: 0.38 },
            { name: "Чернигов", rx: 0.50, ry: 0.20 },
            { name: "Черкассы", rx: 0.53, ry: 0.46 },
            { name: "Житомир", rx: 0.38, ry: 0.33 },
            { name: "Сумы", rx: 0.68, ry: 0.23 },
            { name: "Хмельницкий", rx: 0.30, ry: 0.45 },
            { name: "Ровно", rx: 0.27, ry: 0.30 },
            { name: "Кропивницкий", rx: 0.56, ry: 0.54 },
            { name: "Ивано-Франковск", rx: 0.20, ry: 0.52 },
            { name: "Тернополь", rx: 0.25, ry: 0.42 },
            { name: "Луцк", rx: 0.22, ry: 0.26 },
            { name: "Ужгород", rx: 0.10, ry: 0.55 },
            { name: "Черновцы", rx: 0.26, ry: 0.58 }
        ];

        function initCities() {
            cities = cityData.map(c => ({
                name: c.name,
                x: c.rx * width,
                y: c.ry * height,
                pulse: Math.random() * Math.PI * 2
            }));
            document.getElementById('stat-cities').innerText = cities.length;
        }

        class Aircraft {
            constructor(id, color) {
                this.id = id;
                this.color = color || '#ff3355';
                
                this.route = this.generateLongRoute();
                this.targetIndex = 1;

                this.x = this.route[0].x;
                this.y = this.route[0].y;

                const initialDx = this.route[1].x - this.x;
                const initialDy = this.route[1].y - this.y;
                this.angle = Math.atan2(initialDy, initialDx);

                this.speed = 2.0 + Math.random() * 0.8; 
                this.turnSpeed = 0.03; // Очень плавная дуга при повороте
                
                this.history = [];
                this.maxHistory = 100;
            }

            generateLongRoute() {
                let shuffled = [...cities].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, 6 + Math.floor(Math.random() * 6));
            }

            update() {
                if (this.targetIndex >= this.route.length) {
                    this.route = this.generateLongRoute();
                    this.targetIndex = 0;
                }

                const target = this.route[this.targetIndex];

                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const targetAngle = Math.atan2(dy, dx);

                let diff = targetAngle - this.angle;

                // Приведение угла к пределу -PI .. PI
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;

                // Плавное изменение направления
                this.angle += diff * this.turnSpeed;

                // Движение вперед без сдвига в стороны (без тряски)
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }

                const distanceToTarget = Math.hypot(dx, dy);
                if (distanceToTarget < 40) {
                    this.targetIndex++;
                }
            }

            draw() {
                // Шлейф
                if (this.history.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.history[0].x, this.history[0].y);

                    for (let i = 1; i < this.history.length; i++) {
                        ctx.lineTo(this.history[i].x, this.history[i].y);
                    }

                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Сам летящий объект
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(-6, -5);
                ctx.lineTo(-3, 0);
                ctx.lineTo(-6, 5);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        let aircrafts = [];
        const colors = ['#ff3355', '#38bdf8', '#fbbf24', '#a855f7', '#4ade80'];

        function initAircrafts() {
            aircrafts = [];
            for (let i = 0; i < 3; i++) {
                aircrafts.push(new Aircraft(i + 1, colors[i % colors.length]));
            }
            document.getElementById('stat-objects').innerText = aircrafts.length;
        }

        function addAircraft() {
            const newId = aircrafts.length + 1;
            const color = colors[aircrafts.length % colors.length];
            aircrafts.push(new Aircraft(newId, color));
            document.getElementById('stat-objects').innerText = aircrafts.length;
        }

        function clearTrails() {
            aircrafts.forEach(a => a.history = []);
        }

        function resetAll() {
            initAircrafts();
        }

        function drawMap() {
            cities.forEach(city => {
                city.pulse += 0.03;
                const pSize = Math.sin(city.pulse) * 1.5;

                ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
                ctx.beginPath();
                ctx.arc(city.x, city.y, 6 + pSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(city.x, city.y, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(209, 213, 219, 0.6)';
                ctx.font = '11px "Segoe UI", sans-serif';
                ctx.fillText(city.name, city.x + 8, city.y + 4);
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 7, 10, 0.25)';
            ctx.fillRect(0, 0, width, height);

            drawMap();

            aircrafts.forEach(aircraft => {
                aircraft.update();
                aircraft.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initAircrafts();
        animate();
    </script>
</body>
</html>
