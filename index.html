<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkyGuard: Interceptor</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0f19">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #080c14; color: #fff; }
        
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; filter: brightness(0.7) contrast(1.2); }
        #gameCanvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
        
        /* СТИЛЬНЫЙ ОРАНЖЕВЫЙ МИЛИТАРИ HUD ИНТЕРФЕЙС */
        #top-bar { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .stat-card { 
            background: linear-gradient(135deg, rgba(20, 15, 10, 0.92), rgba(30, 20, 10, 0.85)); 
            border: 1px solid rgba(249, 115, 22, 0.4); 
            padding: 6px 14px; 
            border-radius: 8px; 
            backdrop-filter: blur(10px); 
            font-size: 13px; 
            font-weight: 700; 
            color: #d1d5db;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(249, 115, 22, 0.1);
        }
        .stat-card span { color: #38bdf8; }
        .stat-card.money span { color: #facc15; }
        .stat-card.orange span { color: #f97316; }
        
        #top-controls { position: absolute; top: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; }
        .ctrl-btn { 
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(180, 83, 9, 0.3)); 
            border: 1px solid #f97316; 
            color: #ffedd5; 
            padding: 8px 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 12px; 
            backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.2);
            transition: all 0.2s;
        }
        .ctrl-btn:active { transform: scale(0.95); background: rgba(249, 115, 22, 0.4); }

        #sidebar-shop { 
            position: absolute; 
            top: 90px; 
            left: 12px; 
            bottom: 20px; 
            width: 165px; 
            z-index: 10; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            overflow-y: auto; 
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }
        #sidebar-shop::-webkit-scrollbar { width: 4px; }
        #sidebar-shop::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }

        .shop-item { 
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(24, 15, 10, 0.9)); 
            border: 1px solid rgba(249, 115, 22, 0.25); 
            border-radius: 10px; 
            padding: 9px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 3px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .shop-item:hover, .shop-item.active { border-color: #f97316; background: rgba(249, 115, 22, 0.15); box-shadow: 0 0 12px rgba(249, 115, 22, 0.4); }
        .shop-item:disabled { opacity: 0.35; cursor: not-allowed; border-color: #334155 !important; box-shadow: none; }
        .shop-item .name { font-size: 11px; font-weight: 800; color: #ffedd5; }
        .shop-item .price { font-size: 11px; color: #facc15; font-weight: bold; }
        .shop-item .desc { font-size: 9px; color: #94a3b8; }

        #unit-action-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: linear-gradient(135deg, rgba(20, 15, 10, 0.95), rgba(40, 20, 10, 0.9));
            border: 1px solid #f97316;
            border-radius: 12px;
            padding: 12px 18px;
            display: none;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
        }
        #unit-action-panel .title { font-size: 13px; font-weight: bold; color: #ea580c; }
        .btn-sell {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border: none;
            color: white;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(220, 38, 38, 0.4);
        }

        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; background: rgba(8, 12, 20, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 20px; }
        .modal h1 { font-size: 30px; color: #f97316; text-transform: uppercase; letter-spacing: 2px; text-align: center; text-shadow: 0 0 15px rgba(249, 115, 22, 0.6); }
        .btn { background: linear-gradient(135deg, #ea580c, #c2410c); color: white; border: none; padding: 14px 28px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; min-width: 210px; text-align: center; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4); }
        .btn:active { transform: scale(0.97); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #991b1b); box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4); }

        .lang-select-box { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 8px; }
        .lang-select-box label { font-size: 12px; color: #94a3b8; font-weight: bold; }
        .lang-select-box select { background: #1e293b; color: #ffedd5; border: 1px solid #f97316; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; outline: none; }

        #error-toast { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(220, 38, 38, 0.95); color: white; padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; pointer-events: none; box-shadow: 0 0 12px rgba(220, 38, 38, 0.5); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="top-bar">
        <div class="stat-card money"><span id="lbl-budget">Бюджет</span>: $<span id="money-display">2000</span></div>
        <div class="stat-card orange"><span id="lbl-score">Збито</span>: <span id="score-display">0</span></div>
        <div class="stat-card"><span id="lbl-spawned">Прилетіли</span>: <span id="spawned-display">0</span></div>
    </div>

    <div id="top-controls">
        <button class="ctrl-btn" onclick="toggleSpeed()"><span id="lbl-speed">Прискорення</span>: <span id="speed-btn-txt">x1</span></button>
        <button class="ctrl-btn" onclick="openPauseMenu()">⚙️</button>
    </div>

    <div id="sidebar-shop"></div>
    <div id="unit-action-panel">

        <button class="btn-sell" onclick="sellSelectedUnit()">Продати за $<span id="sell-price-val">0</span></button>
    </div>

    <div id="error-toast"></div>

    <div id="main-menu" class="modal">
        <h1>SkyGuard: Interceptor</h1>
        <p id="lbl-subtitle" style="color: #94a3b8; font-size: 13px; text-align: center; max-width: 320px;">Захистіть інфраструктуру від нальоту ворожих БПЛА та ракет.</p>
        
        <div class="lang-select-box">
            <label id="lbl-lang">Мова / Language</label>
            <select id="lang-selector" onchange="changeLanguage(this.value)">
                <option value="uk">Українська</option>
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="pl">Polski</option>
                <option value="es">Español</option>
                <option value="kk">Қазақша</option>
            </select>
        </div>

        <button class="btn" id="btn-start" onclick="startNewGame()">Почати гру</button>
        <button class="btn" id="btn-load" onclick="loadGame()">Завантажити</button>
    </div>

    <div id="pause-menu" class="modal" style="display: none;">
        <h1 id="lbl-pause">Пауза</h1>
        <button class="btn" id="btn-resume" onclick="resumeGame()">Продовжити</button>
        <button class="btn" id="btn-save" onclick="saveGame()">Зберегти</button>
        <button class="btn btn-danger" id="btn-menu" onclick="toMainMenu()">В меню</button>

                patriot_sprite: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><g transform="translate(150,150)">
                    <rect x="-75" y="-130" width="150" height="260" rx="10" fill="#334155"/>
                    <rect x="-60" y="-100" width="120" height="180" fill="#0f172a" stroke="#f97316" stroke-width="5"/>
                </g></svg>`,

                mig29_sprite: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><g transform="translate(150,150)">
                    <path d="M 0 -140 L -120 80 L -60 120 L 0 80 L 60 120 L 120 80 Z" fill="#38bdf8"/>
                </g></svg>`
            };

            for (let key in svgData) {
                const img = new Image();
                img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgData[key]);
                SPRITES[key] = img;
            }
        }
        loadSprites();

        const map = L.map('map', {
            center: [48.5, 31.2],
            zoom: 6, minZoom: 5, maxZoom: 10, zoomControl: false
        });

        L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png?key=${apiKey}`, { subdomains: 'abcd', maxZoom: 19 }).addTo(map);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const ukraineBoundsPolygon = [
            [52.3, 33.2], [52.1, 31.8], [51.5, 30.6], [51.3, 29.1], [51.9, 28.2],
            [51.5, 25.1], [50.8, 24.2], [49.9, 22.7], [48.0, 23.6], [47.9, 25.8],
            [48.2, 26.6], [48.3, 27.5], [46.4, 29.9], [45.4, 29.6], [45.3, 30.2],
            [46.6, 31.5], [46.5, 32.5], [46.1, 33.6], [46.0, 34.8], [46.8, 36.8],
            [47.1, 38.2], [48.5, 38.3], [49.9, 40.1], [50.4, 38.0], [51.2, 35.3], [52.3, 33.2]
        ];

        function isPointInPolygon(point, vs) {
            let x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i][0], yi = vs[i][1];
                let xj = vs[j][0], yj = vs[j][1];
                let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        const UNIT_TYPES = {
            fpv: { cost: 150, range: 40000, fireRate: 0.5, damage: 100, bulletSpeed: 0, type: 'fpv', speed: 18, spriteKey: 'fpv_sprite', size: 18 },
            mg_pickup: { cost: 250, range: 35000, fireRate: 0.15, damage: 3, bulletSpeed: 110, type: 'mobile', speed: 12, accuracy: 0.65, spriteKey: 'pickup_sprite', size: 24 },
            zu23: { cost: 450, range: 50000, fireRate: 0.12, damage: 5, bulletSpeed: 130, type: 'static', accuracy: 0.72, spriteKey: 'zu23_sprite', size: 26 },
            gepard: { cost: 900, range: 75000, fireRate: 0.08, damage: 7, bulletSpeed: 160, type: 'mobile', speed: 10, accuracy: 0.85, spriteKey: 'gepard_sprite', size: 28 },
            buk: { cost: 1600, range: 130000, fireRate: 1.6, damage: 70, bulletSpeed: 220, type: 'static', accuracy: 0.95, spriteKey: 'buk_sprite', size: 30 },
            patriot: { cost: 2800, range: 200000, fireRate: 2.2, damage: 130, bulletSpeed: 300, type: 'static', accuracy: 0.99, spriteKey: 'patriot_sprite', size: 32 },
            mig29: { cost: 3500, range: 150000, fireRate: 1.0, damage: 50, bulletSpeed: 250, type: 'jet', speed: 25, accuracy: 0.9, spriteKey: 'mig29_sprite', size: 32 }
        };

        // ШАХЕД СТАЛ МЕДЛЕННЕЕ И КОМПАКТНЕЕ
        const ENEMY_TYPES = {
            shahed: { name: 'Шахед-136', speed: 1.4, hp: 35, maxHp: 35, reward: 200, key: 'shahed', size: 20 },
            gerbera: { name: 'Гербера', speed: 1.8, hp: 12, maxHp: 12, reward: 150, key: 'gerbera', size: 16 },
            lancet: { name: 'Ланцет', speed: 2.8, hp: 10, maxHp: 10, reward: 180, key: 'lancet', size: 18 },
            orlan: { name: 'Орлан-10', speed: 1.6, hp: 18, maxHp: 18, reward: 160, key: 'orlan', size: 20 },
            zala: { name: 'ZALA 421', speed: 2.0, hp: 15, maxHp: 15, reward: 170, key: 'zala', size: 18 },
            supercam: { name: 'Supercam', speed: 2.2, hp: 20, maxHp: 20, reward: 190, key: 'supercam', size: 22 },
            missile: { name: 'Ракета Х-101', speed: 4.8, hp: 55, maxHp: 55, reward: 350, key: 'missile', size: 26 }
        };

        // НАМНОГО БОЛЬШЕ ТОЧЕК СПАВНА И ЦЕЛЕЙ
        const spawnPoints = [
            { lat: 52.1, lng: 31.8 }, { lat: 52.3, lng: 33.2 }, { lat: 51.5, lng: 34.8 },
            { lat: 50.8, lng: 35.5 }, { lat: 49.9, lng: 38.1 }, { lat: 48.5, lng: 38.3 },
            { lat: 45.2, lng: 33.5 }, { lat: 45.4, lng: 35.8 }, { lat: 46.1, lng: 36.5 }
        ];

        const targetDestinations = [
            { lat: 50.45, lng: 30.52 }, { lat: 49.99, lng: 36.23 }, { lat: 48.46, lng: 35.04 },
            { lat: 46.48, lng: 30.72 }, { lat: 49.83, lng: 24.02 }, { lat: 47.83, lng: 35.13 },
            { lat: 49.23, lng: 28.46 }, { lat: 50.74, lng: 25.32 }, { lat: 48.92, lng: 24.71 }
        ];

        let gameState = { money: 2000, score: 0, spawnedCount: 0, speed: 1, selectedBuild: null, selectedUnit: null, selectedEnemy: null, isPaused: true };
        let units = [], enemies = [], bullets = [], explosions = [], fires = [];

        function latLngToPoint(lat, lng) {
            const p = map.latLngToContainerPoint([lat, lng]);
            return { x: p.x, y: p.y };
        }

        class Unit {
            constructor(lat, lng, type) {
                this.lat = lat; this.lng = lng; this.type = type;
                this.stats = UNIT_TYPES[type];
                this.targetLat = lat; this.targetLng = lng;
                this.lastShot = 0; this.isMoving = false; this.angle = 0;
            }

            update(dt) {
                // Если дрон FPV патрулирует или стремится к врагу
                if (this.type === 'fpv') {
                    const target = this.findTarget();
                    if (target) {
                        this.targetLat = target.lat;
                        this.targetLng = target.lng;
                        this.isMoving = true;

                        const cur = L.latLng(this.lat, this.lng);
                        const ePos = L.latLng(target.lat, target.lng);
                        // ТАРАН (ВРЕД) - если подлетел вплотную к БПЛА
                        if (cur.distanceTo(ePos) < 1500) {
                            createExplosion(target.lat, target.lng);
                            target.hp -= 100;
                            if (target.hp <= 0) {
                                gameState.money += target.stats.reward; // +200$
                                gameState.score += 1;
                                updateUI();
                            }
                            return false; // FPV УНИЧТОЖАЕТСЯ ПОСЛЕ ТАРАНА!
                        }
                    }
                }

                if (this.isMoving) {
                    const cur = L.latLng(this.lat, this.lng);
                    const dest = L.latLng(this.targetLat, this.targetLng);
                    const dist = cur.distanceTo(dest);

                    if (dist < 100) {
                        this.isMoving = false;
                    } else {
                        const moveDist = (this.stats.speed * 1000 * dt);
                        const ratio = Math.min(moveDist / dist, 1);
                        const p1 = latLngToPoint(this.lat, this.lng);
                        this.lat += (this.targetLat - this.lat) * ratio;
                        this.lng += (this.targetLng - this.lng) * ratio;
                        const p2 = latLngToPoint(this.lat, this.lng);
                        this.angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                    }
                }

                if (this.type !== 'fpv') {
                    this.lastShot += dt;
                    if (this.lastShot >= this.stats.fireRate) {
                        const target = this.findTarget();
                        if (target) { this.shoot(target); this.lastShot = 0; }
                    }
                }

                return true;
            }

            findTarget() {
                let closest = null; let minDist = this.stats.range;
                const pos = L.latLng(this.lat, this.lng);
                for (let enemy of enemies) {
                    const ePos = L.latLng(enemy.lat, enemy.lng);
                    const d = pos.distanceTo(ePos);
                    if (d <= minDist) { minDist = d; closest = enemy; }
                }
                return closest;
            }

            shoot(target) {
                const isHit = Math.random() < this.stats.accuracy;
                bullets.push(new Bullet(this.lat, this.lng, target, this.stats.damage, this.stats.bulletSpeed, isHit));
            }

            draw() {
                const p = latLngToPoint(this.lat, this.lng);

                if (gameState.selectedUnit === this) {
                    const metersPerPixel = 40075016.686 * Math.abs(Math.cos(this.lat * Math.PI / 180)) / Math.pow(2, map.getZoom() + 8);
                    const radiusPx = this.stats.range / metersPerPixel;
                    ctx.beginPath(); ctx.arc(p.x, p.y, radiusPx, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(249, 115, 22, 0.12)'; ctx.fill();
                    ctx.strokeStyle = '#f97316'; ctx.lineWidth = 1.5; ctx.stroke();
                }

                ctx.save(); ctx.translate(p.x, p.y);
                ctx.rotate(this.angle + Math.PI/2);

                const sprite = SPRITES[this.stats.spriteKey];
                const sz = this.stats.size;

                if (sprite && sprite.complete) {
                    ctx.drawImage(sprite, -sz/2, -sz/2, sz, sz);
                } else {
                    ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
        }

        class Enemy {
            constructor(startPoint) {
                this.lat = startPoint.lat; this.lng = startPoint.lng;
                const keys = Object.keys(ENEMY_TYPES);
                const randType = keys[Math.floor(Math.random() * keys.length)];
                this.stats = { ...ENEMY_TYPES[randType] };
                this.hp = this.stats.hp;

                const dest = targetDestinations[Math.floor(Math.random() * targetDestinations.length)];
                this.targetLat = dest.lat; this.targetLng = dest.lng;
                
                this.wobblePhase = Math.random() * 100;
                const startP = latLngToPoint(this.lat, this.lng);
                const destP = latLngToPoint(this.targetLat, this.targetLng);
                this.angle = Math.atan2(destP.y - startP.y, destP.x - startP.x);
            }

            update(dt) {
                const cur = L.latLng(this.lat, this.lng);
                const dest = L.latLng(this.targetLat, this.targetLng);
                const dist = cur.distanceTo(dest);

                if (dist < 3000) {
                    createExplosion(this.lat, this.lng);
                    fires.push(new FireSite(this.targetLat, this.targetLng));
                    return false;
                }

                const moveDist = (this.stats.speed * 1000 * dt);
                const ratio = Math.min(moveDist / dist, 1);
                
                // ЛЕГКИЙ ВИЛЯЮЩИЙ МАРШРУТ (НЕЛИНЕЙНЫЙ ПОЛЕТ)
                this.wobblePhase += dt * 1.5;
                const wobbleOffset = Math.sin(this.wobblePhase) * 0.003;

                this.lat += (this.targetLat - this.lat) * ratio + wobbleOffset * Math.cos(this.angle);
                this.lng += (this.targetLng - this.lng) * ratio + wobbleOffset * Math.sin(this.angle);
                return true;
            }

            draw() {
                const p = latLngToPoint(this.lat, this.lng);

                // Если БПЛА выбран — отображаем КУРС и НАЗВАНИЕ БПЛА СВЕРХУ
                if (gameState.selectedEnemy === this) {
                    const destP = latLngToPoint(this.targetLat, this.targetLng);
                    
                    ctx.beginPath();
                    ctx.setLineDash([5, 5]);
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(destP.x, destP.y);
                    ctx.strokeStyle = '#f97316';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Название БПЛА сверху
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                    ctx.strokeStyle = '#f97316';
                    ctx.lineWidth = 1;
                    ctx.fillRect(p.x - 45, p.y - 32, 90, 18);
                    ctx.strokeRect(p.x - 45, p.y - 32, 90, 18);

                    ctx.fillStyle = '#ffedd5';
                    ctx.font = 'bold 10px Segoe UI';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.stats.name, p.x, p.y - 20);
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(this.angle + Math.PI/2);

                const sprite = SPRITES[this.stats.key];
                const sz = this.stats.size;

                if (sprite && sprite.complete) {
                    ctx.drawImage(sprite, -sz/2, -sz/2, sz, sz);
                } else {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();

                if (this.hp < this.stats.maxHp) {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(p.x - 12, p.y - 14, 24, 3);
                    ctx.fillStyle = '#22c55e'; ctx.fillRect(p.x - 12, p.y - 14, (this.hp / this.stats.maxHp) * 24, 3);
                }
            }
        }

        class FireSite {
            constructor(lat, lng) { this.lat = lat; this.lng = lng; this.life = 15.0; }
            update(dt) { this.life -= dt; }
            draw() {
                if (this.life <= 0) return;
                const p = latLngToPoint(this.lat, this.lng);
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x + (Math.random()-0.5)*4, p.y - (15 - this.life)*2, 4 + Math.random()*4, 0, Math.PI*2);
                ctx.fillStyle = `rgba(100, 100, 100, ${Math.min(0.6, this.life / 10)})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p.x, p.y, 6 + Math.sin(performance.now()*0.01)*2, 0, Math.PI*2);
                ctx.fillStyle = '#ea580c'; ctx.fill();
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fillStyle = '#facc15'; ctx.fill();
                ctx.restore();
            }
        }

        class Bullet {
            constructor(lat, lng, target, damage, speed, isHit) {
                this.lat = lat; this.lng = lng; this.target = target;
                this.damage = damage; this.speed = speed; this.isHit = isHit; this.alive = true;
                this.destLat = target.lat + (isHit ? 0 : (Math.random() - 0.5) * 0.08);
                this.destLng = target.lng + (isHit ? 0 : (Math.random() - 0.5) * 0.08);
            }

            update(dt) {
                const cur = L.latLng(this.lat, this.lng);
                const dest = L.latLng(this.destLat, this.destLng);
                const dist = cur.distanceTo(dest);

                if (dist < 2000) {
                    this.alive = false;
                    if (this.isHit && this.target && this.target.hp > 0) {
                        this.target.hp -= this.damage;
                        if (this.target.hp <= 0) {
                            createExplosion(this.target.lat, this.target.lng);
                            gameState.money += this.target.stats.reward;
                            gameState.score += 1;
                            updateUI();
                        }
                    }
                    return;
                }

                const moveDist = (this.speed * 1000 * dt);
                const ratio = Math.min(moveDist / dist, 1);
                this.lat += (this.destLat - this.lat) * ratio;
                this.lng += (this.destLng - this.lng) * ratio;
            }

            draw() {
                const p = latLngToPoint(this.lat, this.lng);
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#facc15'; ctx.fill();
            }
        }

        class Explosion {
            constructor(x, y) { this.x = x; this.y = y; this.r = 2; this.life = 1.0; }
            update(dt) { this.r += dt * 30; this.life -= dt * 2.0; }
            draw() {
                if (this.life <= 0) return;
                ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(1, this.r), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(249, 115, 22, ${Math.max(0, this.life)})`; ctx.fill();
            }
        }

        function createExplosion(lat, lng) {
            const p = latLngToPoint(lat, lng);
            explosions.push(new Explosion(p.x, p.y));
        }

        function initShopUI() {
            const shopContainer = document.getElementById('sidebar-shop');
            shopContainer.innerHTML = '';
            const uTrans = TRANSLATIONS[currentLang].units;

            for (let key in UNIT_TYPES) {
                const u = UNIT_TYPES[key];
                const tr = uTrans[key];
                const item = document.createElement('button');
                item.className = 'shop-item';
                item.id = `shop-btn-${key}`;
                item.onclick = () => selectBuild(key);
                item.innerHTML = `
                    <span class="name">${tr.name}</span>
                    <span class="price">$${u.cost}</span>
                    <span class="desc">${tr.desc}</span>
                `;
                shopContainer.appendChild(item);
            }
        }

        function selectBuild(type) {
            gameState.selectedBuild = (gameState.selectedBuild === type) ? null : type;
            gameState.selectedUnit = null;
            updateActionPanel();
            updateShopUI();
        }

        function updateShopUI() {
            document.querySelectorAll('.shop-item').forEach(el => el.classList.remove('active'));
            if (gameState.selectedBuild) {
                const activeBtn = document.getElementById(`shop-btn-${gameState.selectedBuild}`);
                if (activeBtn) activeBtn.classList.add('active');
            }

            for (let key in UNIT_TYPES) {
                const btn = document.getElementById(`shop-btn-${key}`);
                if (btn) btn.disabled = gameState.money < UNIT_TYPES[key].cost;
            }
        }

        function updateActionPanel() {
            const panel = document.getElementById('unit-action-panel');
            if (gameState.selectedUnit) {
                const tr = TRANSLATIONS[currentLang].units[gameState.selectedUnit.type];
                document.getElementById('action-unit-name').innerText = tr ? tr.name : 'ПВО';
                document.getElementById('sell-price-val').innerText = Math.floor(gameState.selectedUnit.stats.cost * 0.7);
                panel.style.display = 'flex';
            } else {
                panel.style.display = 'none';
            }
        }

        function sellSelectedUnit() {
            if (gameState.selectedUnit) {
                const sellPrice = Math.floor(gameState.selectedUnit.stats.cost * 0.7);
                gameState.money += sellPrice;
                units = units.filter(u => u !== gameState.selectedUnit);
                gameState.selectedUnit = null;
                updateActionPanel();
                updateUI();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('error-toast');
            toast.innerText = msg; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        map.on('click', function(e) {
            if (gameState.isPaused) return;

            if (gameState.selectedBuild) {
                const isInside = isPointInPolygon([e.latlng.lat, e.latlng.lng], ukraineBoundsPolygon);
                if (!isInside) {
                    showToast(TRANSLATIONS[currentLang].toastErr);
                    return;
                }

                const cost = UNIT_TYPES[gameState.selectedBuild].cost;
                if (gameState.money >= cost) {
                    gameState.money -= cost;
                    units.push(new Unit(e.latlng.lat, e.latlng.lng, gameState.selectedBuild));
                    gameState.selectedBuild = null;
                    updateShopUI(); updateUI();
                }
                return;
            }

            const clickPos = map.latLngToContainerPoint(e.latlng);
            
            // Клик по врагу
            let clickedEnemy = null;
            for (let enemy of enemies) {
                const ePos = map.latLngToContainerPoint([enemy.lat, enemy.lng]);
                if (Math.hypot(clickPos.x - ePos.x, clickPos.y - ePos.y) < 24) {
                    clickedEnemy = enemy;
                    break;
                }
            }

            if (clickedEnemy) {
                gameState.selectedEnemy = clickedEnemy;
                gameState.selectedUnit = null;
                updateActionPanel();
                return;
            } else {
                gameState.selectedEnemy = null;
            }

            // Клик по юниту ПВО
            let clickedUnit = null;
            for (let u of units) {
                const uPos = map.latLngToContainerPoint([u.lat, u.lng]);
                if (Math.hypot(clickPos.x - uPos.x, clickPos.y - uPos.y) < 24) {
                    clickedUnit = u;
                    break;
                }
            }

            if (clickedUnit) {
                gameState.selectedUnit = clickedUnit;
            } else if (gameState.selectedUnit && (gameState.selectedUnit.stats.type === 'mobile' || gameState.selectedUnit.stats.type === 'jet' || gameState.selectedUnit.stats.type === 'fpv')) {
                gameState.selectedUnit.targetLat = e.latlng.lat;
                gameState.selectedUnit.targetLng = e.latlng.lng;
                gameState.selectedUnit.isMoving = true;
            } else {
                gameState.selectedUnit = null;
            }

            updateActionPanel();
        });

        let lastTime = performance.now();
        let spawnTimer = 0;

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1) * gameState.speed;
            lastTime = now;

            if (!gameState.isPaused) {
                spawnTimer += dt;
                if (spawnTimer >= 3.5 / gameState.speed) {
                    const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
                    enemies.push(new Enemy(sp));
                    gameState.spawnedCount += 1;
                    updateUI();
                    spawnTimer = 0;
                }

                units = units.filter(u => u.update(dt));
                enemies = enemies.filter(e => e.update(dt) && e.hp > 0);
                bullets.forEach(b => b.update(dt));
                bullets = bullets.filter(b => b.alive);
                explosions.forEach(ex => ex.update(dt));
                explosions = explosions.filter(ex => ex.life > 0);
                fires.forEach(f => f.update(dt));
                fires = fires.filter(f => f.life > 0);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fires.forEach(f => f.draw());
            units.forEach(u => u.draw());
            enemies.forEach(e => e.draw());
            bullets.forEach(b => b.draw());
            explosions.forEach(ex => ex.draw());

            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('money-display').innerText = Math.floor(gameState.money);
            document.getElementById('score-display').innerText = gameState.score;
            document.getElementById('spawned-display').innerText = gameState.spawnedCount;
            updateShopUI();
            updateActionPanel();
        }

        function toggleSpeed() {
            gameState.speed = (gameState.speed === 1) ? 2 : 1;
            document.getElementById('speed-btn-txt').innerText = `x${gameState.speed}`;
        }

        function startNewGame() {
            units = []; enemies = []; bullets = []; explosions = []; fires = [];
            gameState.money = 2000; gameState.score = 0; gameState.spawnedCount = 0;
            gameState.selectedUnit = null; gameState.selectedBuild = null; gameState.selectedEnemy = null;
            gameState.isPaused = false;
            
            units.push(new Unit(50.45, 30.52, 'zu23'));
            
            document.getElementById('main-menu').style.display = 'none';
            initShopUI();
            updateUI();
        }

        function openPauseMenu() { gameState.isPaused = true; document.getElementById('pause-menu').style.display = 'flex'; }
        function resumeGame() { gameState.isPaused = false; document.getElementById('pause-menu').style.display = 'none'; }
        function toMainMenu() { document.getElementById('pause-menu').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; }

        function saveGame() {
            const data = { money: gameState.money, score: gameState.score, spawnedCount: gameState.spawnedCount, units: units.map(u => ({ lat: u.lat, lng: u.lng, type: u.type })) };
            localStorage.setItem('pvo_save_v5', JSON.stringify(data));
            alert('Збережено!');
        }

        function loadGame() {
            const data = localStorage.getItem('pvo_save_v5');
            if (!data) return alert('Сохранений нет!');
            const parsed = JSON.parse(data);
            gameState.money = parsed.money; gameState.score = parsed.score; gameState.spawnedCount = parsed.spawnedCount || 0;
            units = parsed.units.map(u => new Unit(u.lat, u.lng, u.type));
            enemies = []; bullets = []; explosions = []; fires = [];
            gameState.isPaused = false;
            document.getElementById('main-menu').style.display = 'none';
            initShopUI();
            updateUI();
        }

        changeLanguage('uk');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
